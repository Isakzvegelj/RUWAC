name: Fedora source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora@sha256:05e3c351a7e762aca8fb067a9a92c1f775a7c4fbb1382c97cdd87bd6fb5b162c
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_HOME: ${{ runner.temp }}/cargo
      CARGO_TARGET_DIR: ${{ runner.temp }}/target
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Install Fedora test tools
        run: dnf install -y git cargo rust rustfmt clippy gcc gcc-c++ pkgconf-pkg-config gtk4-devel libadwaita-devel openssl openssl-devel libssh2-devel python3 screen tmux
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Public inventory and format
        run: |
          python3 scripts/public-files.py --tracked
          python3 .github/scripts/test-label-pr.py
          cargo fmt --all --check --manifest-path ruwac/Cargo.toml
          cargo fmt --all --check --manifest-path ruwac/desktop/Cargo.toml
      - name: Clippy and unit tests
        run: |
          cargo clippy --locked --workspace --all-targets --manifest-path ruwac/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path ruwac/desktop/Cargo.toml
          cargo test --locked --workspace --manifest-path ruwac/Cargo.toml
          cargo test --locked --manifest-path ruwac/desktop/Cargo.toml
      - name: Locked declarations and independent headless graph
        run: python3 scripts/dependency-check.py --output "$RUNNER_TEMP/dependencies.json"
      - name: Real headless protocol and persistence fixtures
        run: |
          cargo build --locked --manifest-path ruwac/Cargo.toml
          mkdir -p "$RUNNER_TEMP/ruwac-evidence"
          for test in spike desktop_state jobs jobs_capacity recovery screen_previous screen_copy history_snapshot mixed_nesting; do
            python3 "ruwac/tests/integration/$test.py" --binary "$CARGO_TARGET_DIR/debug/ruwac" --evidence "$RUNNER_TEMP/ruwac-evidence"
          done

  advisories:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora@sha256:05e3c351a7e762aca8fb067a9a92c1f775a7c4fbb1382c97cdd87bd6fb5b162c
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_HOME: ${{ runner.temp }}/audit-cargo
      CARGO_TARGET_DIR: ${{ runner.temp }}/audit-target
    steps:
      - name: Install advisory scanner prerequisites
        run: dnf install -y git cargo rust gcc gcc-c++ cmake perl openssl-devel pkgconf-pkg-config
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/audit-tool"
      - name: Check both lockfiles without advisory exceptions
        run: |
          "$RUNNER_TEMP/audit-tool/bin/cargo-audit" audit --file ruwac/Cargo.lock
          "$RUNNER_TEMP/audit-tool/bin/cargo-audit" audit --file ruwac/desktop/Cargo.lock
