name: Fedora source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora@sha256:05e3c351a7e762aca8fb067a9a92c1f775a7c4fbb1382c97cdd87bd6fb5b162c
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Initialize isolated build paths
        run: |
          printf 'CARGO_HOME=%s/cargo\nCARGO_TARGET_DIR=%s/target\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install Fedora test tools
        run: dnf install -y git cargo rust rustfmt clippy gcc gcc-c++ pkgconf-pkg-config gtk4-devel libadwaita-devel openssl openssl-devel libssh2-devel sqlite-devel python3 screen tmux fzf
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Trust only the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate GitHub workflow syntax and contexts
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/workflow-tools"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/workflow-tools" actionlint
          "$RUNNER_TEMP/workflow-tools/actionlint" -shellcheck= -pyflakes=
      - name: Public source inventory
        run: python3 scripts/public-files.py --tracked
      - name: Contribution label guards
        run: python3 .github/scripts/test-label-pr.py
      - name: Rust formatting
        run: |
          cargo fmt --all --check --manifest-path ruwac/Cargo.toml
          cargo fmt --all --check --manifest-path ruwac/desktop/Cargo.toml
      - name: Rust lint
        run: |
          cargo clippy --locked --workspace --all-targets --manifest-path ruwac/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path ruwac/desktop/Cargo.toml
      - name: Rust unit tests
        run: |
          cargo test --locked --workspace --manifest-path ruwac/Cargo.toml
          cargo test --locked --manifest-path ruwac/desktop/Cargo.toml
      - name: Locked declarations and independent headless graph
        run: python3 scripts/dependency-check.py --output "$RUNNER_TEMP/dependencies.json"
      - name: Real headless protocol and persistence fixtures
        run: |
          cargo build --locked --manifest-path ruwac/Cargo.toml
          mkdir -p "$RUNNER_TEMP/ruwac-evidence"
          for test in spike desktop_state jobs jobs_capacity recovery screen_previous screen_copy history_snapshot primary_history checkpoint_validation terminal_styles_apps mixed_nesting; do
            python3 "ruwac/tests/integration/$test.py" --binary "$CARGO_TARGET_DIR/debug/ruwac" --evidence "$RUNNER_TEMP/ruwac-evidence"
          done

  advisories:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora@sha256:05e3c351a7e762aca8fb067a9a92c1f775a7c4fbb1382c97cdd87bd6fb5b162c
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Initialize isolated scanner paths
        run: |
          printf 'CARGO_HOME=%s/audit-cargo\nCARGO_TARGET_DIR=%s/audit-target\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install advisory scanner prerequisites
        run: dnf install -y git cargo rust gcc gcc-c++ cmake perl openssl-devel pkgconf-pkg-config
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Trust only the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install pinned advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked --root "$RUNNER_TEMP/audit-tool"
      - name: Headless dependency advisories
        run: '"$RUNNER_TEMP/audit-tool/bin/cargo-audit" audit --file ruwac/Cargo.lock'
      - name: Desktop dependency advisories
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/audit-tool/bin/cargo-audit" audit --file ruwac/desktop/Cargo.lock'
