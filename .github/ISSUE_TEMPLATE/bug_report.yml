name: Bug report
description: Report reproducible RUWAC behavior using sanitized evidence.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Release or commit
      description: Include CLI and desktop versions when they differ.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and expected behavior
      description: Use generated data and include OS, desktop and relevant protocols.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and impact
      description: Do not include passwords, keys, private host maps, clipboard contents or raw operational logs. Report vulnerabilities through the security policy.
    validations:
      required: true
