[package]
name = "ruwac-desktop"
version = "0.1.2"
edition = "2024"
publish = false
[workspace]
[dependencies]
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_12"] }
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_4"] }
pangocairo = "0.22"
serde_json = "=1.0.151"
ruwac-protocol = { path = "../crates/ruwac-protocol" }
ruwac-clipboard = { path = "../crates/ruwac-clipboard" }
libc = "=0.2.189"
sha2 = "=0.10.9"
ironrdp = { version = "=0.17.0", features = ["connector", "session", "graphics", "pdu"] }
ironrdp-tokio = { version = "=0.10.0", features = ["reqwest-native-tls"] }
tokio = { version = "=1.53.1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
native-tls = "=0.2.18"
tokio-native-tls = "=0.3.1"
x509-cert = "=0.2.5"
[profile.dev]
debug = 0
[profile.release]
strip = true
