[package]
name = "ruwac-desktop"
version = "0.1.0-beta.2"
edition = "2024"
publish = false
[workspace]
[dependencies]
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_12"] }
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_4"] }
pangocairo = "0.22"
serde_json = "=1.0.151"
ruwac-protocol = { path = "../crates/ruwac-protocol" }
ruwac-clipboard = { path = "../crates/ruwac-clipboard" }
libc = "=0.2.189"
sha2 = "=0.10.9"
[profile.dev]
debug = 0
[profile.release]
strip = true
